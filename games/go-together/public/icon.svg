  <circle cx="38" cy="23" r="7" fill="#e5372f"/>
  <circle cx="60" cy="23" r="7" fill="#e5372f"/>
  <circle cx="82" cy="23" r="7" fill="#e5372f"/>
  <!-- Four Cards below: two lifted, two waiting. -->
  <g>
    <rect x="14" y="44" width="40" height="40" rx="9" fill="#fff" stroke="#e3e8f2" stroke-width="3"/>
    <rect x="66" y="40" width="40" height="40" rx="9" fill="#fff" stroke="#ffce4f" stroke-width="4"/>
    <rect x="14" y="92" width="40" height="22" rx="9" fill="#fff" stroke="#e3e8f2" stroke-width="3"/>
    <rect x="66" y="88" width="40" height="22" rx="9" fill="#fff" stroke="#ffce4f" stroke-width="4"/>
    <!-- a blue square on the left cards, a green leaf-ish blob on the lifted ones -->
    <rect x="26" y="56" width="16" height="16" rx="3" fill="#3b7be0"/>
    <path d="M86 50c9 2 12 10 10 18-8 2-16-2-17-10 2-5 4-7 7-8z" fill="#2fa36b"/>
    <rect x="26" y="98" width="16" height="10" rx="3" fill="#3b7be0"/>
